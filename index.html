        mergeCityIntoRuntime(cfg);
        hideError('mutation');
        return true;
      } catch (err) {
        showError(handleRLSError(err, 'add'), 'mutation');
        return false;
      }
    }

    // Fetches the live cities table and merges it into CITIES (never
    // replaces it) -- the static object stays as an offline-safe bootstrap
    // seed the map can draw from before this fetch ever resolves. On
    // failure, degrades to exactly the 5 static cities, same posture as
    // doFetchLocations()/fetchNeighborhoodShapes().
    async function fetchCities() {
      try {
        const { data, error } = await supabaseClient
          .from('cities')
          .select('id,label,center_lat,center_lng,zoom,geocode_suffix,countrycodes,viewbox');
        if (error) throw error;
        (data || []).forEach(row => {
          CITIES[row.id] = {
            label: row.label, center: [row.center_lat, row.center_lng], zoom: row.zoom,
            geocodeSuffix: row.geocode_suffix, countrycodes: row.countrycodes, viewbox: row.viewbox
          };
        });
        populateCityInput();
        createCitySelector();
        updateCitySelectorUI();
        hideError('cities');
      } catch (err) {
        showError(`Failed to load cities: ${err.message}`, 'cities');
      }
    }

    // ---- add-form city detection state ---------------------------------------
    let pendingNewCity = null;
    let userOverrodeCity = false;   // a manual cityInput pick stops further auto-guessing this form session

    async function maybeDetectCity(lat, lng, addressDetails) {
      if (userOverrodeCity) return;
      const matched = matchCity(lat, lng);
      if (matched) {
        document.getElementById('cityInput').value = matched;
        hideNewCityConfirm();
        return;
      }
      if (!addressDetails) return;   // not enough signal to consider a new city
      const derived = await deriveNewCityConfig(addressDetails, lat, lng);
      if (!derived || userOverrodeCity) return;   // re-check: user may have acted while the derivation was in flight
      showNewCityConfirm(derived);
    }

    function showNewCityConfirm(cfg) {
      pendingNewCity = cfg;
      document.getElementById('newCityConfirmText').textContent =
        `"${cfg.label}" isn't in your city list yet. Add it?`;
      document.getElementById('newCityConfirm').style.display = '';
    }

    function hideNewCityConfirm() {
      pendingNewCity = null;
      document.getElementById('newCityConfirm').style.display = 'none';
    }

    // ---- add-form city -------------------------------------------------------

    // Rebuilding innerHTML on a <select> silently resets its selected value
    // to whatever option is now first -- a real problem once this can be
    // called mid-session (fetchCities() resolving after boot, a new city
    // being merged in) rather than only once at cold start. Preserve
    // whatever was selected, when it still exists after the rebuild.
    function populateCityInput() {
      const select = document.getElementById('cityInput');
      const previous = select.value;
      select.innerHTML =
        Object.entries(CITIES)
          .map(([id, c]) => `<option value="${id}">${escapeHtml(c.label)}</option>`)
          .join('');
      if (previous && CITIES[previous]) select.value = previous;
    }

    // The single source of truth for geocoding context and for the inserted row.
    function formCityId() {
      const select = document.getElementById('cityInput');
      const v = select ? select.value : null;
      return CITIES[v] ? v : activeCity;
    }

    function syncAddFormCity() {
      document.getElementById('cityInput').value = defaultFormCity();
    }

    function defaultFormCity() {
      if (!isAllCities()) return activeCity;
      // In all-cities view, guess from what the user is actually looking at,
      // rather than from a stale authoring context.
      const c = map.getCenter();
      const ranked = rankCitiesByProximity([c.lat, c.lng], 150);
      return ranked.length ? ranked[0].cityId : activeCity;
    }

    // ---- poll ----------------------------------------------------------------

    function currentPollMs() {
      return (Date.now() - lastInteractionAt < IDLE_AFTER_MS) ? POLL_ACTIVE_MS : POLL_IDLE_MS;
    }

    function startPoll() {
      if (pollTimer) return;
      pollScheduledMs = currentPollMs();
      pollTimer = setTimeout(pollTick, pollScheduledMs);
    }

    function stopPoll() {
      clearTimeout(pollTimer);
      pollTimer = null;
    }

    function pollTick() {
      pollTimer = null;
      // Phase 2 hook: refreshTodayKey() belongs here, so date-dependent
      // rendering rolls over even in a tab that never fires visibilitychange.
      fetchLocations();
      startPoll();
    }

    // Any user interaction resets the idle back-off. Only reschedules when the
    // pending wait is longer than the active cadence, so constant interaction
    // can never starve the poll.
    function noteInteraction() {
      lastInteractionAt = Date.now();
      if (pollTimer && pollScheduledMs > POLL_ACTIVE_MS) {
        stopPoll();
        startPoll();
      }
    }

    function centerOnUserLocation() {
      const btn = document.getElementById('centerMeBtn');
      
      if (!navigator.geolocation) {
        showError('Geolocation is not supported by your browser', 'geolocation');
        return;
      }
      
      btn.classList.add('loading');
      
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const { latitude, longitude } = position.coords;
          
          // Remove old user location marker if exists
          if (userLocationMarker) {
            map.removeLayer(userLocationMarker);
          }
          
          // "You are here" is not a category, so it deliberately carries no
          // glyph and no category ink -- a plain navy dot with a paper rim.
          const userIcon = L.divIcon({
            html: `<div style="background: var(--navy); width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--navy), inset 0 0 0 4px var(--paper), 0 1px 0 rgba(0,0,0,0.25);"></div>`,
            className: '',
            iconSize: [16, 16],
            iconAnchor: [8, 8]
          });

          userLocationMarker = L.marker([latitude, longitude], { icon: userIcon }).addTo(map);
          userLocationMarker.bindPopup('<div class="popup-title" style="text-align:center">You are here</div>');
          
          // Center map on user location
          focusMap([latitude, longitude], 14, { animate: true });

          btn.classList.remove('loading');
          hideError('geolocation');
        },
        (error) => {
          btn.classList.remove('loading');
          let errorMsg = 'Unable to get your location';
          
          switch(error.code) {
            case error.PERMISSION_DENIED:
              errorMsg = 'Location permission denied. Enable location access in browser settings.';
              break;
            case error.POSITION_UNAVAILABLE:
              errorMsg = 'Location information unavailable. Check GPS settings.';
              break;
            case error.TIMEOUT:
              errorMsg = 'Location request timed out. Try again.';
              break;
          }
          
          showError(errorMsg, 'geolocation');
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }
    
    // The banner is a single shared DOM element, but errors come from
    // unrelated sources (the locations poll, the shapes fetch, a mutation,
    // geolocation) -- without tracking which one is currently showing, any
    // OTHER source's success would call hideError() and mask a real error
    // before it's read. hideError(source) only clears when it matches
    // whoever's currently showing; the newest showError() always wins the
    // single banner slot outright, since only one message fits at a time.
    let currentErrorSource = null;

    function showError(msg, source) {
      currentErrorSource = source;
      document.getElementById('errorText').textContent = msg;
      document.getElementById('error').classList.add('show');
    }

    function hideError(source) {
      if (source !== currentErrorSource) return;
      currentErrorSource = null;
      document.getElementById('error').classList.remove('show');
    }

    // =========================================================================
    // Rendering — id-keyed reconcilers. Nothing here tears down and rebuilds:
    // a poll tick, a filter tap and a city switch are all just a different
    // result from visibleLocations(), diffed against what is already on screen.
    // =========================================================================

    // Everything that affects a marker's position, icon or popup. loc.city is
    // included because a location moved between cities keeps its id, so only
    // the signature can force the refresh.
    function markerSignature(loc) {
      return [loc.name, loc.address, loc.category, loc.lat, loc.lng,
              loc.notes, loc.visited, loc.city].join('|');
    }

    // Everything the list card renders.
    function cardSignature(loc) {
      return [loc.name, loc.address, loc.category, loc.visited].join('|');
    }

    // =========================================================================
    // GLYPHS & BADGES
    // Badge SHAPE encodes the data state, which the list could not previously
    // express at all:
    //   circle             -> a `locations` pin
    //   diamond            -> a `neighborhood_shapes` feature
    //   circle, dashed rim -> an "(approx.)" fallback pin from
    //                         findApproximatePoint() -- indistinguishable
    //                         from a real pin before this.
    // =========================================================================

    // The old 24px marker was a colored DOT carrying no glyph, so it never
    // needed interior room. 28px minus a 2px rim leaves a 24px field and an
    // ~18px glyph -- the practical floor for telling 11 silhouettes apart
    // over live map tiles.
    const MARKER_SIZE    = 28;
    const MARKER_SIZE_HI = 36;

    // Below this zoom pins cluster and 11 pictograms stop being readable, so
    // markers drop to badge SHAPE only -- which still answers the question
    // that matters at that scale ("is that a pin or a district?").
    const GLYPH_MIN_ZOOM = 12;

    function categoryInk(category) {
      return CATEGORY_COLORS[category] || CATEGORY_COLORS.other;
    }

    // An approximate pin records its provenance in the name suffix written by
    // handleAddShapeSubmit(); that is the only marker of its kind on the row.
    function markerKind(loc) {
      if (typeof loc.name === 'string' && loc.name.indexOf('(approx.)') !== -1) return 'dashed';
      return 'circle';
    }

    // Bare glyph, no shell -- chips, popups.
    function glyphHtml(category, size) {
      return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true"><use href="#g-${escapeAttr(category)}"/></svg>`;
    }

    // Stamped-seal badge: paper field, category-ink rim, category-ink glyph.
    // Legible over any tile value, and readable WITHOUT the legend.
    //
    // Defaults are `currentColor` / `var(--badge-field)` so a ROW can flip
    // the whole badge to paper on the reversed highlighted block just by
    // changing its own `color` -- no re-render, and no category ink ever
    // lands on the --figure-deep field. Markers, which live outside that
    // cascade, pass explicit colours instead.
    function badgeHtml(category, kind, size, opts = {}) {
      const ink  = opts.ink  || 'currentColor';
      const fill = opts.fill || 'var(--badge-field, #F2EBDD)';
      const mark = opts.mark || ink;
      const rim  = opts.rim || 2;
      const c    = size / 2;
      const r    = c - rim / 2;

      let shell;
      if (kind === 'diamond') {
        const p = `${c},${rim / 2} ${size - rim / 2},${c} ${c},${size - rim / 2} ${rim / 2},${c}`;
        shell = `<polygon points="${p}" fill="${fill}" stroke="${ink}" stroke-width="${rim}" stroke-linejoin="round"/>`;
      } else if (kind === 'dashed') {
        shell = `<circle cx="${c}" cy="${c}" r="${r}" fill="${fill}" stroke="${ink}" stroke-width="${rim}" stroke-dasharray="3 3"/>`;
      } else {
        shell = `<circle cx="${c}" cy="${c}" r="${r}" fill="${fill}" stroke="${ink}" stroke-width="${rim}"/>`;
      }

      let glyph = '';
      if (opts.glyph !== false) {
        const g = Math.round(size * 0.62);
        const o = (size - g) / 2;
        glyph = `<svg x="${o}" y="${o}" width="${g}" height="${g}" viewBox="0 0 24 24" style="color:${mark}"><use href="#g-${escapeAttr(category)}"/></svg>`;
      }
      return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">${shell}${glyph}</svg>`;
    }

    function markerIcon(loc, highlighted) {
      const size = highlighted ? MARKER_SIZE_HI : MARKER_SIZE;
      const showGlyph = !map || map.getZoom() >= GLYPH_MIN_ZOOM;
      const ink = categoryInk(loc.category);
      const html = `<div class="${highlighted ? 'highlighted-marker' : ''}" style="width:${size}px;height:${size}px;line-height:0;">` +
        badgeHtml(loc.category, markerKind(loc), size, {
          ink,
          // Highlighted inverts: ink field, paper glyph.
          fill: highlighted ? ink : '#F2EBDD',
          mark: highlighted ? '#F2EBDD' : ink,
          rim: highlighted ? 2.5 : 2,
          glyph: showGlyph
        }) + '</div>';
      return L.divIcon({
        html,
        className: '',
        iconSize: [size, size],
        iconAnchor: [size / 2, size / 2]
      });
    }

    // Re-icons every marker when the map crosses GLYPH_MIN_ZOOM. Guarded on a
    // state flag so an ordinary zoom tick touches nothing.
    let lastGlyphZoomOn = null;
    function syncMarkerGlyphZoom() {
      if (!map) return;
      const on = map.getZoom() >= GLYPH_MIN_ZOOM;
      if (on === lastGlyphZoomOn) return;
      lastGlyphZoomOn = on;
      markersById.forEach((entry, id) => {
        entry.marker.setIcon(markerIcon(entry.loc, id === highlightedId));
      });
    }

    function buildPopupHtml(loc) {
      const ink = categoryInk(loc.category);
      return `
        <div style="min-width: 200px;">
          <div class="popup-title">${escapeHtml(loc.name)}</div>
          <div class="popup-cat"><span style="color:${ink};display:flex">${glyphHtml(loc.category, 20)}</span>${escapeHtml(loc.category)}</div>
          ${loc.address ? `<div class="popup-addr">${escapeHtml(loc.address)}</div>` : ''}
          ${loc.notes ? `<div class="popup-notes">${escapeHtml(loc.notes)}</div>` : ''}
          ${loc.visited ? '<div class="popup-visited">&#10003; Visited</div>' : ''}
        </div>
      `;
    }

    // The single writer of highlight state. Highlight lives here, not on the
    // marker objects, so a reconciled marker can be recreated without losing it.
    function setHighlighted(id) {
      if (highlightedId === id) return;
      const prev = highlightedId;
      highlightedId = id;

      [prev, id].forEach(key => {
        if (!key) return;
        const marker = markersById.get(key);
        if (marker) marker.marker.setIcon(markerIcon(marker.loc, key === id));
        const card = cardsById.get(key);
        if (card) card.el.classList.toggle('highlighted', key === id);
      });
    }

    function highlightMarker(locationId) {
      const location = locations.find(loc => loc.id === locationId);
      if (!location) return;

      noteInteraction();
      setHighlighted(locationId);
      focusMap([location.lat, location.lng], { atLeast: 14 }, { animate: true, duration: 0.5 });

      const entry = markersById.get(locationId);
      if (entry) {
        // Let the pan start before the popup opens.
        setTimeout(() => entry.marker.openPopup(), 300);
      }
    }

    function updateUI() {
      const visible = visibleLocations();
      const visibleShapes = visibleNeighborhoodShapes();
      document.querySelector('#locationsHeader h2').textContent =
        `${activeCityLabel()} list (${visible.length + visibleShapes.length})`;
      syncMarkers(visible);
      syncLocationCards(visible);
      syncShapeCards(visibleShapes, visible.length);
      syncNeighborhoodLayers();

      // Empty state + bottom spacer always come last, after both card kinds.
      const list = document.getElementById('locationsList');
      const emptyState = document.getElementById('locationsEmpty');
      emptyState.style.display = (visible.length + visibleShapes.length) === 0 ? 'block' : 'none';
      if (list.lastElementChild !== listSpacer) {
        list.appendChild(emptyState);
        list.appendChild(listSpacer);
      }
    }

    // ---- neighborhood shape rendering (Phase 3) ------------------------------
    // Binary add/remove at a zoom threshold, not an always-present opacity
    // fade -- below the threshold every zoom level renders pixel-identical to
    // before this feature existed.
    function neighborhoodMinZoom(nb) {
      return nb.min_zoom ?? (cityConfig(nb.city).zoom + 3);
    }

    // The dash patterns are the same two the district/street GLYPHS use, so
    // the map layer and the chrome rhyme: a street is a dotted trail, a
    // district is a tag outline -- distinguishable at a glance and in
    // monochrome, without relying on colour.
    function neighborhoodStyle(nb) {
      return nb.type === 'street'
        ? { color: nb.color || '#5A564C', weight: 6, opacity: 0.9, dashArray: '2 8', lineCap: 'round' }
        : { color: nb.color || '#5A564C', weight: 2.5, opacity: 0.9, dashArray: '6 4', fillOpacity: 0.12 };
    }

    function buildNeighborhoodLayer(nb) {
      const layer = nb.type === 'street'
        ? L.polyline(nb.geometry, neighborhoodStyle(nb))
        : L.polygon(nb.geometry, neighborhoodStyle(nb));
      layer.bindPopup(
        `<strong>${escapeHtml(nb.label)}</strong>${nb.note ? `<p>${escapeHtml(nb.note)}</p>` : ''}`
      );
      return layer;
    }

    // City + category filtered, no zoom involved -- this is "what matches the
    // user's filters," used by the sidebar list/count. A list enumerates
    // everything available; it isn't a viewport, so zoom has no business
    // hiding rows from it (unlike the map layer, see mapVisibleNeighborhoodShapes()).
    function visibleNeighborhoodShapes() {
      return neighborhoodShapes.filter(nb => {
        if (!filters.categories[nb.type]) return false;   // same category filter chips as pins
        if (!isAllCities() && nb.city !== activeCity) return false;
        return true;
      });
    }

    // Adds the zoom gate on top of visibleNeighborhoodShapes() -- only this
    // one feeds the actual map layer, so the map still stays uncluttered when
    // zoomed out while the list shows everything that matches the filters.
    function mapVisibleNeighborhoodShapes() {
      const zoom = map.getZoom();
      return visibleNeighborhoodShapes().filter(nb => zoom >= neighborhoodMinZoom(nb));
    }

    function syncNeighborhoodLayers() {
      if (!map) return;
      const shouldShow = new Set(mapVisibleNeighborhoodShapes().map(nb => nb.id));

      shouldShow.forEach(id => {
        if (neighborhoodLayersById.has(id)) return;
        const nb = neighborhoodShapes.find(n => n.id === id);
        neighborhoodLayersById.set(id, buildNeighborhoodLayer(nb).addTo(map));
      });

      neighborhoodLayersById.forEach((layer, id) => {
        if (shouldShow.has(id)) return;
        map.removeLayer(layer);
        neighborhoodLayersById.delete(id);
      });
    }

    function syncMarkers(visible) {
      const seen = new Set();

      visible.forEach(loc => {
        seen.add(loc.id);
        const signature = markerSignature(loc);
        const entry = markersById.get(loc.id);

        if (!entry) {
          const marker = L.marker([loc.lat, loc.lng], {
            icon: markerIcon(loc, loc.id === highlightedId)
          }).addTo(map);
          marker.locationId = loc.id;
          marker.bindPopup(buildPopupHtml(loc));
          markersById.set(loc.id, { marker, signature, loc });
          return;
        }

        entry.loc = loc;
        if (signature !== entry.signature) {
          entry.signature = signature;
          entry.marker.setLatLng([loc.lat, loc.lng]);
          entry.marker.setIcon(markerIcon(loc, loc.id === highlightedId));
          entry.marker.setPopupContent(buildPopupHtml(loc));
        }
      });

      markersById.forEach((entry, id) => {
        if (seen.has(id)) return;
        map.removeLayer(entry.marker);
        markersById.delete(id);
        if (highlightedId === id) highlightedId = null;
      });
    }

    function createCard(loc) {
      const el = document.createElement('div');
      el.className = 'location-card';
      el.style.cursor = 'pointer';
      el.setAttribute('data-id', loc.id);

      // Listeners are attached once, at creation — not on every render.
      let touchMoved = false;

      const addActive = (e) => {
        if (!e.target.closest('.location-actions')) {
          touchMoved = false;
          el.classList.add('active');
        }
      };
      const removeActive = () => el.classList.remove('active');
      const handleTouchMove = () => { touchMoved = true; removeActive(); };

      el.addEventListener('mousedown', addActive);
      el.addEventListener('touchstart', addActive, { passive: true });
      el.addEventListener('touchmove', handleTouchMove, { passive: true });
      el.addEventListener('mouseup', removeActive);
      el.addEventListener('mouseleave', removeActive);
      el.addEventListener('touchend', removeActive);
      el.addEventListener('touchcancel', removeActive);

      el.addEventListener('click', (e) => {
        const id = el.getAttribute('data-id');
        const current = locations.find(l => l.id === id);

        if (e.target.closest('.visit-btn')) {
          if (current) toggleVisited(current.id, current.visited);
          return;
        }
        if (e.target.closest('.delete-btn')) {
          if (current) confirmDelete(current.id, current.name);
          return;
        }
        if (touchMoved) return;   // the tap was a scroll
        highlightMarker(id);
      });

      return el;
    }

    // A ledger row, not a card: 28px glyph | 1fr content | action cluster.
    // The category ink moved out of a 4px left border and into the glyph;
    // the label is --ink-2 and the metadata line reads CATEGORY · CITY.
    function renderCard(el, loc) {
      const ink = categoryInk(loc.category);
      const city = loc.city && CITIES[loc.city] ? CITIES[loc.city].label : loc.city;
      el.innerHTML = `
        <div class="row-badge" style="--row-ink:${ink}">${badgeHtml(loc.category, markerKind(loc), 24)}</div>
        <div class="row-main">
          <h3>${escapeHtml(loc.name)}</h3>
          <div class="row-meta">${escapeHtml(loc.category)}${city ? ' &middot; ' + escapeHtml(city) : ''}</div>
        </div>
        <div class="location-actions">
          <button class="visit-btn ${loc.visited ? 'visited' : ''}" aria-label="Toggle visited">${loc.visited ? '&#10003;' : ''}</button>
          <button class="delete-btn" aria-label="Delete">&times;</button>
        </div>
      `;
    }

    function syncLocationCards(visible) {
      const list = document.getElementById('locationsList');
      const seen = new Set();

      visible.forEach((loc, index) => {
        seen.add(loc.id);
        let entry = cardsById.get(loc.id);

        if (!entry) {
          entry = { el: createCard(loc), signature: null };
          cardsById.set(loc.id, entry);
        }

        const signature = cardSignature(loc);
        if (signature !== entry.signature) {
          renderCard(entry.el, loc);
          entry.signature = signature;
        }
        entry.el.classList.toggle('highlighted', loc.id === highlightedId);

        if (list.children[index] !== entry.el) {
          list.insertBefore(entry.el, list.children[index] || null);
        }
      });

      cardsById.forEach((entry, id) => {
        if (seen.has(id)) return;
        entry.el.remove();
        cardsById.delete(id);
      });
    }

    // ---- neighborhood shape list cards ---------------------------------------
    // Mirrors createCard()/renderCard()/syncLocationCards() for pins, but
    // shapes have no address/visited state and are framed by bounds, not a
    // point -- see focusShape(). pinOffset places these cards right after the
    // pin cards syncLocationCards() just wrote, so the two reconcilers can
    // share one DOM list without stepping on each other's child indices.
    function shapeCardSignature(nb) {
      return [nb.label, nb.type, nb.color].join('|');
    }

    function focusShape(shapeId) {
      const nb = neighborhoodShapes.find(n => n.id === shapeId);
      if (!nb) return;

      noteInteraction();
      const bounds = L.latLngBounds(nb.geometry).pad(0.15);
      if (prefersReducedMotion()) {
        map.fitBounds(bounds, { animate: false });
      } else {
        map.flyToBounds(bounds, { duration: 0.5 });
      }

      // zoomend (fired by the above) re-runs syncNeighborhoodLayers, so the
      // layer may not exist yet on this tick -- give it one before opening.
      setTimeout(() => {
        const layer = neighborhoodLayersById.get(shapeId);
        if (layer) layer.openPopup();
      }, 300);
    }

    function createShapeCard(nb) {
      const el = document.createElement('div');
      el.className = 'location-card';
      el.style.cursor = 'pointer';
      el.setAttribute('data-shape-id', nb.id);

      let touchMoved = false;
      const addActive = (e) => {
        if (!e.target.closest('.location-actions')) {
          touchMoved = false;
          el.classList.add('active');
        }
      };
      const removeActive = () => el.classList.remove('active');
      const handleTouchMove = () => { touchMoved = true; removeActive(); };

      el.addEventListener('mousedown', addActive);
      el.addEventListener('touchstart', addActive, { passive: true });
      el.addEventListener('touchmove', handleTouchMove, { passive: true });
      el.addEventListener('mouseup', removeActive);
      el.addEventListener('mouseleave', removeActive);
      el.addEventListener('touchend', removeActive);
      el.addEventListener('touchcancel', removeActive);

      el.addEventListener('click', (e) => {
        const id = Number(el.getAttribute('data-shape-id'));
        const current = neighborhoodShapes.find(n => n.id === id);

        if (e.target.closest('.delete-btn')) {
          if (current) confirmDeleteShape(current.id, current.label);
          return;
        }
        if (touchMoved) return;   // the tap was a scroll
        focusShape(id);
      });

      return el;
    }

    // Same ledger row, but the badge is a DIAMOND -- the shape, not the
    // colour, is what tells a district apart from a pin.
    function renderShapeCard(el, nb) {
      const ink = nb.color || categoryInk(nb.type);
      const city = nb.city && CITIES[nb.city] ? CITIES[nb.city].label : nb.city;
      el.innerHTML = `
        <div class="row-badge" style="--row-ink:${ink}">${badgeHtml(nb.type, 'diamond', 24)}</div>
        <div class="row-main">
          <h3>${escapeHtml(nb.label)}</h3>
          <div class="row-meta">${escapeHtml(nb.type)}${city ? ' &middot; ' + escapeHtml(city) : ''}</div>
        </div>
        <div class="location-actions">
          <button class="delete-btn" aria-label="Delete">&times;</button>
        </div>
      `;
    }

    function syncShapeCards(visible, pinOffset) {
      const list = document.getElementById('locationsList');
      const seen = new Set();

      visible.forEach((nb, index) => {
        seen.add(nb.id);
        let entry = shapeCardsById.get(nb.id);

        if (!entry) {
          entry = { el: createShapeCard(nb), signature: null };
          shapeCardsById.set(nb.id, entry);
        }

        const signature = shapeCardSignature(nb);
        if (signature !== entry.signature) {
          renderShapeCard(entry.el, nb);
          entry.signature = signature;
        }

        const targetIndex = pinOffset + index;
        if (list.children[targetIndex] !== entry.el) {
          list.insertBefore(entry.el, list.children[targetIndex] || null);
        }
      });

      shapeCardsById.forEach((entry, id) => {
        if (seen.has(id)) return;
        entry.el.remove();
        shapeCardsById.delete(id);
      });
    }

    function createCitySelector() {
      const container = document.getElementById('cityFilters');
      const entries = Object.entries(CITIES)
        .map(([id, c]) => [id, c.label])
        .concat([[ALL_CITIES, 'All cities']]);

      container.innerHTML = entries
        .map(([id, label]) => `<button class="city-btn" data-city="${escapeHtml(id)}">${escapeHtml(label)}</button>`)
        .join('');

      container.querySelectorAll('.city-btn').forEach(btn => {
        btn.onclick = () => setActiveCity(btn.getAttribute('data-city'));
      });
    }

    function updateCitySelectorUI() {
      document.querySelectorAll('#cityFilters .city-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-city') === citySelection);
      });
    }

    // Chips are ink-on-paper with the category glyph, never white-on-category
    // -colour (which measured 1.80:1 on the old palette). The ink arrives as
    // --chip-ink so the `.inactive` rule can override it without !important,
    // and ONLY the bottom rule changes between states -- contrast is constant,
    // so all 11 stay AA whatever their ink.
    function createFilters() {
      const container = document.getElementById('filters');
      container.innerHTML = Object.keys(CATEGORY_COLORS).map(cat => `
        <button class="filter-btn" id="filter-${cat}" style="--chip-ink: ${CATEGORY_COLORS[cat]}">
          <span class="chip-glyph">${glyphHtml(cat, 12)}</span>${cat}
        </button>
      `).join('');

      Object.keys(CATEGORY_COLORS).forEach(cat => {
        document.getElementById(`filter-${cat}`).onclick = () => {
          noteInteraction();
          filters.categories[cat] = !filters.categories[cat];
          const btn = document.getElementById(`filter-${cat}`);
          if (filters.categories[cat]) {
            btn.classList.remove('inactive');
          } else {
            btn.classList.add('inactive');
          }
          updateUI();
        };
      });
    }

    // An explicit "clear filters" control would call this. setActiveCity must
    // never call it: category filters are a statement of intent, orthogonal to
    // geography, and survive a city switch untouched.
    function resetCategoryFilters() {
      Object.keys(CATEGORY_COLORS).forEach(cat => {
        filters.categories[cat] = true;
        const btn = document.getElementById(`filter-${cat}`);
        if (btn) btn.classList.remove('inactive');
      });
      updateUI();
    }
    window.confirmDelete = (id, name) => {
      if (confirm(`Delete ${name}?`)) {
        deleteLocation(id);
      }
    };
    window.confirmDeleteShape = (id, label) => {
      if (confirm(`Delete ${label}?`)) {
        deleteNeighborhoodShape(id);
      }
    };
    
    document.getElementById('floatingAddBtn').onclick = async () => {
      const controls = document.getElementById('controls');
      const form = document.getElementById('addForm');
      const btn = document.getElementById('floatingAddBtn');

      // If trying to open the form, check auth first
      if (!btn.classList.contains('active')) {
        if (!await requireAuth()) return;
        noteInteraction();
        syncAddFormCity();   // default only — the user's explicit pick wins
      }

      controls.classList.toggle('show');
      form.classList.toggle('show');
      btn.classList.toggle('active');

      setAddBtnGlyph(btn.classList.contains('active'));
    };

    // The +/× glyph as SVG rather than a text character.
    function setAddBtnGlyph(isClose) {
      const btn = document.getElementById('floatingAddBtn');
      btn.innerHTML = isClose
        ? '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>'
        : '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
    }

    document.getElementById('toggleFiltersBtn').onclick = () => {
      const filtersPanel = document.getElementById('filtersPanel');
      const toggleBtn = document.getElementById('toggleFiltersBtn');
      filtersPanel.classList.toggle('visible');
      toggleBtn.classList.toggle('active');
    };

    document.getElementById('collapseBtn').onclick = () => {
      const locations = document.getElementById('locations');
      const collapseBtn = document.getElementById('collapseBtn');
      const mapElement = document.getElementById('map');
      const mainContent = document.getElementById('mainContent');
      const filtersPanel = document.getElementById('filtersPanel');

      locations.classList.toggle('collapsed');
      collapseBtn.classList.toggle('collapsed');
      mapElement.classList.toggle('expanded');
      filtersPanel.classList.toggle('collapsed-mode');

      // Adjust mainContent bottom to match location panel height
      const safeAreaBottom = getComputedStyle(document.documentElement).getPropertyValue('--safe-area-inset-bottom');
      if (locations.classList.contains('collapsed')) {
        mainContent.style.bottom = `calc(60px + ${safeAreaBottom})`;
      } else {
        mainContent.style.bottom = '300px';
      }

      // Force Leaflet to redraw map after resize
      setTimeout(() => {
        map.invalidateSize();
      }, 300);
    };

    document.getElementById('centerMeBtn').onclick = centerOnUserLocation;

    // Auth event listeners
    document.getElementById('loginBtn').onclick = login;
    document.getElementById('logoutBtn').onclick = logout;
    document.getElementById('cancelAuthBtn').onclick = hideAuthModal;
    document.getElementById('accountBtn').onclick = toggleAccountDropdown;
    document.getElementById('dropdownLogoutBtn').onclick = logout;

    // Close auth modal when clicking outside
    document.getElementById('authModal').onclick = (e) => {
      if (e.target.id === 'authModal') {
        hideAuthModal();
      }
    };

    // Close account dropdown when clicking outside
    document.addEventListener('click', (e) => {
      const accountBtn = document.getElementById('accountBtn');
      const accountDropdown = document.getElementById('accountDropdown');

      if (!accountBtn.contains(e.target) && !accountDropdown.contains(e.target)) {
        hideAccountDropdown();
      }
    });

    // Allow Enter key to submit login
    document.getElementById('authPasswordInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        login();
      }
    });

    // Set up place name autocomplete with debouncing (1000ms delay to avoid rate limiting)
    const debouncedSearch = debounce(searchAddress, 1000);
    const nameInput = document.getElementById('nameInput');

    nameInput.addEventListener('input', (e) => {
      debouncedSearch(e.target.value);
    });

    // Hide autocomplete when clicking outside
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#addressInputWrapper')) {
        hideAutocomplete();
      }
    });

    // Hide autocomplete when pressing Escape
    nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        hideAutocomplete();
      }
    });

    // Changing the city context invalidates any autocomplete results already
    // shown, since they were queried under the old city's countrycodes/viewbox.
    document.getElementById('cityInput').addEventListener('change', () => {
      userOverrodeCity = true;   // a real user tap, never a programmatic .value set -- see maybeDetectCity()
      hideAutocomplete();
    });

    document.getElementById('newCityConfirmAdd').onclick = async () => {
      if (!pendingNewCity) return;
      const cfg = pendingNewCity;
      const btn = document.getElementById('newCityConfirmAdd');
      btn.disabled = true;
      const ok = await addCity(cfg);
      btn.disabled = false;
      if (ok) {
        document.getElementById('cityInput').value = cfg.id;
      }
      hideNewCityConfirm();
    };

    document.getElementById('newCityConfirmDismiss').onclick = () => {
      userOverrodeCity = true;   // stop re-guessing; the manual select is the fallback from here
      hideNewCityConfirm();
    };

    // A category IS the mode: 'district'/'street' mean "fetch an OSM shape,"
    // every other category means "a normal pin." One dropdown drives both
    // what fields are shown AND which table the submit goes to (see
    // isShapeCategory() / submitBtn.onclick below) -- no separate toggle.
    function isShapeCategory(category) {
      return category === 'district' || category === 'street';
    }

    document.getElementById('categoryInput').addEventListener('change', (e) => {
      const isShape = isShapeCategory(e.target.value);
      document.getElementById('addressInput').style.display = isShape ? 'none' : '';
      document.getElementById('addressInput').required = !isShape;
      document.getElementById('shapeHint').style.display = isShape ? '' : 'none';
      document.getElementById('nameInput').placeholder = isShape
        ? 'Neighborhood/street name to search OSM for (e.g. Nørrebro)'
        : 'Search for a place...';
      hideAutocomplete();
    });

    function closeAddForm() {
      selectedPlace = null;
      userOverrodeCity = false;
      hideNewCityConfirm();
      hideShapeCityConfirm();
      document.getElementById('nameInput').value = '';
      document.getElementById('addressInput').value = '';
      document.getElementById('notesInput').value = '';
      document.getElementById('categoryInput').value = 'restaurant';
      document.getElementById('categoryInput').dispatchEvent(new Event('change'));
      document.getElementById('controls').classList.remove('show');
      document.getElementById('addForm').classList.remove('show');
      document.getElementById('floatingAddBtn').classList.remove('active');
      setAddBtnGlyph(false);
      document.getElementById('submitBtn').textContent = 'Add Location';
      document.getElementById('submitBtn').disabled = false;
    }

    // ---- shape-flow city resolution (post-fetch) ------------------------

    let pendingShapeCity = null;   // { resolved, saveShape } while shapeCityConfirm is showing

    function hideShapeCityConfirm() {
      pendingShapeCity = null;
      document.getElementById('shapeCityConfirm').style.display = 'none';
    }

    // Analogue of showNewCityConfirm() for the shape flow -- but unlike a
    // pin (one point, matched or not), a shape's geometry has already been
    // through resolveShapeCity(), which may have a best-guess existing city
    // even when it isn't confident. Offer that as a one-tap alternative to
    // creating a new city, rather than only create-or-abandon.
    function showShapeCityConfirm(resolved, saveShape) {
      pendingShapeCity = { resolved, saveShape };
      const addToBtn = document.getElementById('shapeCityConfirmAddTo');
      if (resolved.winner) {
        addToBtn.style.display = '';
        addToBtn.textContent = `Add to ${cityConfig(resolved.winner).label}`;
        document.getElementById('shapeCityConfirmText').textContent =
          `This doesn't clearly fit ${cityConfig(resolved.winner).label}. Add it as a new city, or file it under ${cityConfig(resolved.winner).label} anyway?`;
      } else {
        addToBtn.style.display = 'none';
        document.getElementById('shapeCityConfirmText').textContent =
          `This doesn't match any known city. Add it as a new city?`;
      }
      document.getElementById('shapeCityConfirm').style.display = '';
    }

    document.getElementById('shapeCityConfirmAddCity').onclick = async () => {
      if (!pendingShapeCity) return;
      const { resolved, saveShape } = pendingShapeCity;
      const btn = document.getElementById('shapeCityConfirmAddCity');
      btn.disabled = true;
      const addressDetails = await nominatimReverse(resolved.centroid[0], resolved.centroid[1]);
      const cfg = addressDetails ? await deriveNewCityConfig(addressDetails, resolved.centroid[0], resolved.centroid[1]) : null;
      btn.disabled = false;
      if (!cfg) {
        alert('Could not determine a new city from this location. Try "Add to" an existing city instead.');
        return;
      }
      const ok = await addCity(cfg);
      if (!ok) return;
      hideShapeCityConfirm();
      await saveShape(cfg.id);
    };

    document.getElementById('shapeCityConfirmAddTo').onclick = async () => {
      if (!pendingShapeCity || !pendingShapeCity.resolved.winner) return;
      const { resolved, saveShape } = pendingShapeCity;
      hideShapeCityConfirm();
      await saveShape(resolved.winner);
    };

    document.getElementById('shapeCityConfirmCancel').onclick = () => {
      hideShapeCityConfirm();
      document.getElementById('submitBtn').textContent = 'Add Location';
      document.getElementById('submitBtn').disabled = false;
    };

    // A single OSM lookup, one click, one form -- fetch and save happen
    // together so there is no separate authoring step for a shape added this
    // way (unlike tools/neighborhood-shapes.html, which is for bulk/offline
    // authoring and produces code to paste in by hand). The pre-fetch
    // cityInput selection only biases the OSM query (viewbox/countrycodes) --
    // the row's actual `city` is resolved from the fetched geometry itself
    // via resolveShapeCity(), which is robust to (a) a shape straddling two
    // cities' bounds and (b) a spurious OSM merge dragging in an unrelated
    // cluster of points (see resolveShapeCity()'s doc comment).
    async function handleAddShapeSubmit() {
      const name = document.getElementById('nameInput').value.trim();
      const type = document.getElementById('categoryInput').value;   // 'district' | 'street'
      const notes = document.getElementById('notesInput').value.trim();
      const cityHint = formCityId();

      if (!name) {
        alert('Please provide a name to search for.');
        return;
      }

      noteInteraction();
      document.getElementById('submitBtn').textContent = 'Fetching area...';
      document.getElementById('submitBtn').disabled = true;

      const cfg = cityConfig(cityHint);
      const fetched = type === 'street'
        ? await overpassWay(name, cfg)
        : await nominatimPolygon(name, cfg);

      if (!fetched) {
        const point = await findApproximatePoint(name, cfg);
        if (!point) {
          alert(`Could not find "${name}" on OpenStreetMap at all -- no boundary/way, no point, no node. Try a more specific or differently-spelled name.`);
          document.getElementById('submitBtn').textContent = 'Add Location';
          document.getElementById('submitBtn').disabled = false;
          return;
        }

        const pointResolved = resolveShapeCity([[point.lat, point.lng]], null);
        const savePin = async (city) => {
          const tag = `Approximate placement -- OSM has no boundary/way for this ${type}; resolved via ${point.tier}.`;
          await addLocation({
            name: `${name} (approx.)`,
            address: null,
            category: type,
            city,
            lat: point.lat,
            lng: point.lng,
            notes: notes ? `${notes}\n\n${tag}` : tag,
            visited: false
          });
          closeAddForm();
        };

        if (pointResolved.confident) {
          await savePin(pointResolved.winner);
          return;
        }
        document.getElementById('submitBtn').textContent = 'Add Location';
        document.getElementById('submitBtn').disabled = false;
        showShapeCityConfirm(pointResolved, savePin);
        return;
      }

      const geometry = type === 'street' ? fetched.points : fetched;
      const segmentLengths = type === 'street' ? fetched.segmentLengths : null;
      const resolved = resolveShapeCity(geometry, segmentLengths);

      if (resolved.droppedPoints) {
        console.warn(`"${name}": dropped ${resolved.droppedPoints} point(s) that disagreed with the majority city (likely an unrelated OSM way merged in).`);
      }

      const saveShape = async (city) => {
        await addNeighborhoodShape({
          city,
          type,
          label: name,
          color: CATEGORY_COLORS[type],
          note: notes || null,
          geometry: resolved.cleanedGeometry
        });
        closeAddForm();
      };

      if (resolved.confident) {
        await saveShape(resolved.winner);
        return;
      }

      document.getElementById('submitBtn').textContent = 'Add Location';
      document.getElementById('submitBtn').disabled = false;
      showShapeCityConfirm(resolved, saveShape);
    }

    async function handleAddLocationSubmit() {
      const name = document.getElementById('nameInput').value;
      const address = document.getElementById('addressInput').value;
      const category = document.getElementById('categoryInput').value;
      const notes = document.getElementById('notesInput').value;

      if (!name || !address) {
        alert('Please provide name and address');
        return;
      }

      noteInteraction();
      document.getElementById('submitBtn').textContent = 'Adding...';
      document.getElementById('submitBtn').disabled = true;

      // An address picked from autocomplete is already geocoded (and already
      // ran through maybeDetectCity() in selectAddress()) — re-geocoding a
      // full Nominatim display_name is a wasted (and worse) round trip.
      const alreadySelected = selectedPlace && selectedPlace.address === address;
      const coords = alreadySelected
        ? { lat: selectedPlace.lat, lng: selectedPlace.lng }
        : await geocode(address);

      if (!coords) {
        alert('Could not geocode address. Try a different address.');
        document.getElementById('submitBtn').textContent = 'Add Location';
        document.getElementById('submitBtn').disabled = false;
        return;
      }

      // Freeform-typed-and-submitted path never went through selectAddress()'s
      // detection -- this is that path's one chance, right before insert.
      if (!alreadySelected && coords.addressDetails) {
        await maybeDetectCity(coords.lat, coords.lng, coords.addressDetails);
      }

      // Covers BOTH paths: an autocomplete pick may have left a new-city
      // prompt showing (selectAddress() doesn't block on it), and the
      // freeform path may have just raised one above. Either way, inserting
      // under the old cityInput value right now would silently use the
      // wrong city -- stop and let the user resolve the prompt, then submit
      // again (Add City just updates cityInput, it doesn't reopen the form).
      if (pendingNewCity) {
        document.getElementById('submitBtn').textContent = 'Add Location';
        document.getElementById('submitBtn').disabled = false;
        return;
      }
      const city = formCityId();   // read AFTER detection may have updated cityInput

      await addLocation({
        name,
        address,
        category,
        city,
        lat: coords.lat,
        lng: coords.lng,
        notes: notes || null,
        visited: false
      });

      closeAddForm();
    }

    document.getElementById('submitBtn').onclick = () => {
      return isShapeCategory(document.getElementById('categoryInput').value)
        ? handleAddShapeSubmit()
        : handleAddLocationSubmit();
    };

    // minZoom: without it a user can zoom out to world level and pan into a
    // repeating world copy, where markers (rendered on one copy only) vanish
    // with no error. worldCopyJump brings them back when panning past ±180°.
    // No maxBounds: a per-city clamp would break the center-me button at a
    // city's edge, and Copenhagen/Malmö are one travel area across the Øresund.
    map = L.map('map', { minZoom: 3, worldCopyJump: true })
           .setView(CITIES[DEFAULT_CITY].center, CITIES[DEFAULT_CITY].zoom);
    // CARTO's light basemap instead of standard OSM: OSM's default raster
    // tiles are the single biggest pastel offender, and no amount of CSS
    // around them fixes a minty picture. The aging filter lives on
    // .leaflet-tile-pane ONLY (see the stylesheet) -- applying it to
    // .leaflet-pane would sepia the markers and popups too.
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap contributors © CARTO',
      subdomains: 'abcd',
      minZoom: 3,
      maxZoom: 19
    }).addTo(map);

    map.on('dragend zoomend', noteInteraction);
    map.on('zoomend', syncNeighborhoodLayers);
    map.on('zoomend', syncMarkerGlyphZoom);

    // Initialize auth and set up auth state listener
    supabaseClient.auth.onAuthStateChange((event, session) => {
      currentUser = session?.user || null;
      updateAuthUI();

      // If user just signed in and auth modal is open, close it
      if (event === 'SIGNED_IN' && document.getElementById('authModal').classList.contains('show')) {
        hideAuthModal();
      }
    });

    // Check auth on page load
    checkAuth();

    // The list's scroll gradient listener is attached ONCE, here — not inside a
    // renderer, where it used to leak one listener per poll tick.
    const locationsListEl = document.getElementById('locationsList');
    locationsListEl.addEventListener('scroll', () => {
      if (locationsListEl.scrollTop > 0) {
        locationsListEl.classList.add('scrolling');
      } else {
        locationsListEl.classList.remove('scrolling');
      }
    }, { passive: true });

    // Persistent tail elements of the list, owned by syncLocationCards().
    const listSpacer = document.createElement('div');
    listSpacer.className = 'location-list-spacer';
    const locationsEmptyEl = document.createElement('div');
    locationsEmptyEl.className = 'locations-empty';
    locationsEmptyEl.id = 'locationsEmpty';
    // One of the few screens with nothing to be efficient about, so it gets
    // the space: 48px of padding and a 28px glyph.
    locationsEmptyEl.innerHTML =
      '<svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><use href="#g-compass"/></svg>Nothing here yet.';
    locationsEmptyEl.style.display = 'none';
    locationsListEl.appendChild(locationsEmptyEl);
    locationsListEl.appendChild(listSpacer);

    populateCityInput();
    createCitySelector();
    createFilters();

    // Sole entry point for city state. On cold start there is nothing to
    // animate away from, so framing is instant.
    const restoredCity = restoreCitySelection();          // cityId | ALL_CITIES | null
    setActiveCity(restoredCity ?? DEFAULT_CITY, { animate: false });

    fetchLocations();
    fetchNeighborhoodShapes();
    fetchCities();
    startPoll();

    // The bottom sheet becomes a left rail at >=900px (see the media query).
    // Leaflet has to be told its container changed size when that flips; the
    // inline `bottom` the collapse handler writes would otherwise fight the
    // media query, so it is cleared on the way into rail mode.
    const railQuery = window.matchMedia('(min-width: 900px)');
    const handleRailChange = (e) => {
      if (e.matches) document.getElementById('mainContent').style.bottom = '';
      setTimeout(() => map.invalidateSize(), 50);
    };
    if (railQuery.addEventListener) railQuery.addEventListener('change', handleRailChange);
    else if (railQuery.addListener) railQuery.addListener(handleRailChange);
    if (railQuery.matches) document.getElementById('mainContent').style.bottom = '';

    // A phone in a pocket is the dominant state of this app during a trip:
    // pause entirely while hidden, catch up immediately on return.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopPoll();
      } else {
        lastInteractionAt = Date.now();
        fetchLocations();
        startPoll();
      }
    });
  </script>
</body>
</html>
